<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="review-token" content="__REVIEW_TOKEN__"><title>塗り絵の制作確認</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f8f8;color:#213e4b;font:15px/1.65 system-ui,sans-serif}header{background:#fff;border-bottom:1px solid #d8e5e7;padding:20px 28px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}h1{font-size:23px;margin:0}h2{font-size:18px}p{margin:6px 0}main{max-width:1500px;margin:auto;padding:24px}.status{margin-bottom:20px;padding:14px 20px;background:#e5f3ec;border-radius:14px}.status.bad{background:#fff0ed;color:#853c31}.status p{font-size:13px}.previews{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}figure{margin:0;background:white;border:1px solid #d7e4e7;border-radius:12px;overflow:hidden}canvas{display:block;width:100%;aspect-ratio:4/5;background:white}figcaption{text-align:center;padding:9px;font-weight:700;font-size:14px}button,select,input{font:inherit}button{border:0;border-radius:12px;background:#236477;color:#fff;padding:11px 18px;cursor:pointer;min-height:44px}button:disabled{opacity:.5;cursor:wait}select,input[type=text],input[type=number]{border:1px solid #b6c9ce;border-radius:7px;background:white;color:#213e4b;padding:7px;min-height:40px;max-width:100%}input[type=checkbox]{width:22px;height:22px;vertical-align:middle;accent-color:#236477}input[type=range]{width:100px;accent-color:#236477}table{border-collapse:collapse;width:100%;background:#fff}th,td{text-align:left;padding:9px;border-bottom:1px solid #dce5e7;font-size:13px}th{background:#e9f1f2;white-space:nowrap}.table-wrap{overflow:auto;border-radius:12px;border:1px solid #d7e4e7}tbody tr:focus-within{background:#f0faf5}.approval{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:#fff;padding:20px;margin-top:20px;border-radius:14px}.notice{font-size:13px;color:#56717b}.save-secondary{background:#e3eef0;color:#213e4b}.error{color:#a33125;font-weight:700}.legend{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0;font-size:12px}.legend i{display:inline-block;width:14px;height:14px;border:1px solid #7c969c;border-radius:4px;vertical-align:middle;margin-right:4px}@media(max-width:1100px){.previews{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){main{padding:14px}.previews{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:16px}.approval{align-items:stretch;flex-direction:column}}
</style></head><body><header><h1>塗り絵の制作確認</h1><label>線画 <select id="template-select" aria-label="確認する線画"></select></label><span class="notice">変更はこの端末の制作ファイルへ保存します。</span></header><main>
<div id="status" class="status" role="status">線画を読み込んでいます…</div>
<section class="previews" aria-label="仕上がりの比較"><figure><canvas id="original" aria-label="原画"></canvas><figcaption>原画</figcaption></figure><figure><canvas id="regions" aria-label="領域色分け"></canvas><figcaption>領域色分け</figcaption></figure><figure><canvas id="materials" aria-label="素材色分け"></canvas><figcaption>素材色分け</figcaption></figure><figure><canvas id="smooth" aria-label="なめらか仕上げ"></canvas><figcaption>なめらか仕上げ</figcaption></figure><figure><canvas id="crayon" aria-label="クレヨン仕上げ"></canvas><figcaption>クレヨン仕上げ</figcaption></figure><figure><canvas id="pencil" aria-label="色えんぴつ仕上げ"></canvas><figcaption>色えんぴつ仕上げ</figcaption></figure></section>
<div id="legend" class="legend" aria-label="素材の凡例"></div>
<h2>領域ごとの素材と仕上げ</h2><p class="notice">設定は上の3画材へすぐ反映されます。本体と同じ描画エンジンで確認できます。素材の向きは固定角度です。</p>
<div class="table-wrap"><table><thead><tr><th>ID</th><th>領域名</th><th>素材</th><th>信頼度</th><th>陰影</th><th>ハイライト</th><th>質感</th><th>向き</th></tr></thead><tbody id="region-rows"></tbody></table></div>
<div class="approval"><button id="save" class="save-secondary">修正を保存・承認を解除</button><label>確認者 <input id="reviewer" type="text" maxlength="100" placeholder="確認者の名前"></label><label><input id="confirm" type="checkbox"> 全領域と3画材を確認しました</label><button id="approve">承認して保存</button></div>
<p class="notice">初期素材の「制作時の技術確認」と、人がこの画面で行う「人間承認」は区別して記録します。修正のみの保存では承認が解除され、本体の一覧から外れます。原画の曲線を変更した場合も再承認が必要です。</p><p id="message" role="status"></p>
</main><script type="module" src="/review-client.js"></script></body></html>
